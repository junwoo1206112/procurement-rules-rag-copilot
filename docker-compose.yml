services:
  api:
    build: .
    ports: ["8000:8000"]
    volumes:
      - ./data:/service/data
      - ./docs:/service/docs
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b
      LAW_API_OC: ${LAW_API_OC}
      G2B_SERVICE_KEY: ${G2B_SERVICE_KEY}
    depends_on: [ollama]
  ollama:
    image: ollama/ollama:latest
    volumes: ["ollama-data:/root/.ollama"]
volumes:
  ollama-data:
